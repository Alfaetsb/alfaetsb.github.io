 if(r.status===401&&!opt.retry){try{await refresh();return api(path,Object.assign({retry:1},opt))}catch(e){setSes(null);boot();throw e}}

async function dash(){const d0=new Date();d0.setHours(0,0,0,0);const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);
 const V=VNT.filter(v=>!v.annulee),vj=V.filter(v=>new Date(v.date)>=d0),vm=V.filter(v=>new Date(v.date)>=m0),T=l=>l.reduce((a,v)=>a+v.q*v.pu,0),imp=V.reduce((a,v)=>a+Math.max(0,v.q*v.pu-v.paye),0),seuil=+SET.seuil||0,low=PROD.filter(p=>p.qte<=seuil).sort((a,b)=>a.qte-b.qte);

 ${low.length?`<h3>À signaler : stock faible<button onclick="go('stock')">Stock ›</button></h3><div class="bx">${low.slice(0,5).map(p=>li(p.qte<=0?'⛔':'⚠️',p.nom,p.qte<=0?'Rupture de stock':'Stock faible',p.qte<=0?'0':nf(p.qte),p.qte<=0?'r':'o')).join('')}</div>`:''}

 $('main').innerHTML=`<div class="vpH"><b>Journal d’activité</b></div>${j.map(x=>`<div class="vpI" style="cursor:default"><span class="av" style="background:#eaf2fe;color:#245a7b">${esc(ini(x.user_nom||'?'))}</span><span class="nm"><b>${esc(x.texte)}</b><span>${new Date(x.d).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'})} · ${esc(x.user_nom||'')}</span></span></div>`).join('')||'<div class="em">Aucune activité.</div>'}`}

/* ---------- boutiques ---------- */
function pickB(){if(!isAdm())return;openSheet(`<h2 style="margin-top:0">Lieu de travail</h2><div class="vpI" onclick="setLieu('')"><span class="av" style="background:#eaf2fe;color:#245a7b">🏬</span><span class="nm"><b>Stock principal</b><span>Entrepôt central · ventes de toutes les boutiques</span></span>${LIEU===''?'<span class="rt">✔</span>':''}</div>${BQ.map(b=>`<div class="vpI" onclick="setLieu('${b.id}')"><span class="av" style="background:#e3f6ee;color:#0f7a4d">${esc(ini(b.nom))}</span><span class="nm"><b>${esc(b.nom)}</b><span>${esc(b.adr||'')}</span></span>${LIEU===String(b.id)?'<span class="rt">✔</span>':''}</div>`).join('')}<button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Fermer</button>`)}
function setLieu(v){LIEU=v;try{localStorage.setItem('alfa2-lieu',v)}catch(e){}closeSheet();go(TAB)}
async function bout(){SBQ=await api('stock_boutique?select=boutique_id,produit_id,qte&limit=20000');const rows=BQ.map(b=>{const l=SBQ.filter(x=>x.boutique_id===b.id),u=l.reduce((a,x)=>a+(+x.qte),0);return{b,u,n:l.filter(x=>+x.qte>0).length}});
 $('main').innerHTML=`<div class="vpH"><b>Boutiques</b></div><div class="vpK"><div><span>Boutiques</span><b>${BQ.length}</b></div><div><span>Unités en boutique</span><b>${nf(rows.reduce((a,r)=>a+r.u,0))}</b></div></div>${isAdm()?'<button class="btn gold" style="width:100%;margin:6px 0 10px" onclick="editBout(0)">+ Nouvelle boutique</button>':''}${rows.map(r=>`<div class="vpI" onclick="boutSheet(${r.b.id})"><span class="av" style="background:#e3f6ee;color:#0f7a4d">${esc(ini(r.b.nom))}</span><span class="nm"><b>${esc(r.b.nom)}</b><span>${esc(r.b.resp||'')}${r.b.adr?' · '+esc(r.b.adr):''}</span><span>${nf(r.u)} unités · ${r.n} produits</span></span></div>`).join('')||'<div class="em">Aucune boutique.</div>'}`}
function boutSheet(id){const b=BQ.find(x=>x.id===id);if(!b)return;const m={};SBQ.filter(x=>x.boutique_id===id).forEach(x=>m[x.produit_id]=+x.qte);const L=PROD.filter(p=>m[p.id]>0||false);
 openSheet(`<h2 style="margin-top:0">${esc(b.nom)}</h2><p style="color:var(--mut);margin:0 0 10px">${esc(b.resp||'')} ${esc(b.adr||'')} ${esc(b.hor||'')}</p><h3 style="margin:8px 0">Stock de la boutique</h3><div>${(PROD.filter(p=>m[p.id]>0).map(p=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(p.nom)}</b><span>${esc(p.sku||'')}</span></div><b>${nf(m[p.id])}</b></div>`).join(''))||'<p style="color:var(--mut)">Aucun produit dans cette boutique.</p>'}</div>${isAdm()?`<button class="btn gold" style="width:100%;margin-top:10px" onclick="trfSheet(${id},1)">⇩ Approvisionner depuis le stock principal</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="trfSheet(${id},-1)">⇧ Retour vers le stock principal</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="editBout(${id})">Modifier la boutique</button>`:''}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`)}
function trfSheet(id,sens){const m={};SBQ.filter(x=>x.boutique_id===id).forEach(x=>m[x.produit_id]=+x.qte);const L=sens>0?PROD.filter(p=>(p.qteM!=null?p.qteM:p.qte)>0):PROD.filter(p=>m[p.id]>0);
 openSheet(`<h2 style="margin-top:0">${sens>0?'Approvisionnement':'Retour au stock principal'}</h2><label>Produit</label><input id="tp" list="tpl" placeholder="Choisir un produit" oninput="trfInfo(${id},${sens})"><datalist id="tpl">${L.map(p=>`<option value="${esc(p.nom)}">`).join('')}</datalist><p id="ti" style="color:var(--mut);margin:0 0 8px"></p><label>Quantité</label><input id="tq" type="number" inputmode="decimal"><button class="btn gold" style="width:100%" onclick="trfSave(${id},${sens})">Valider</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="boutSheet(${id})">Retour</button>`)}
function trfInfo(id,sens){const p=PROD.find(x=>x.nom===$('tp').value);if(!p){$('ti').textContent='';return}const m=SBQ.find(x=>x.boutique_id===id&&x.produit_id===p.id);$('ti').textContent='Stock principal : '+nf(p.qteM!=null?p.qteM:p.qte)+' · Boutique : '+nf(m?m.qte:0)}
async function trfSave(id,sens){const p=PROD.find(x=>x.nom===$('tp').value),q=+$('tq').value;if(!p)return toast('Choisissez un produit de la liste.');if(!(q>0))return toast('Quantité invalide.');
 try{await api('rpc/transferer',{m:'POST',b:{p_boutique:id,p_produit:p.id,p_qte:sens*q}});await api('journal',{m:'POST',b:{user_id:ME.id,user_nom:ME.nom,texte:(sens>0?'Approvisionnement ':'Retour ')+nf(q)+' × '+p.nom+' · '+(BQ.find(b=>b.id===id)||{}).nom}});closeSheet();toast('Transfert enregistré');go('bout')}catch(e){toast(e.message)}}
function editBout(id){const b=BQ.find(x=>x.id===id)||{nom:'',resp:'',adr:'',hor:'',note:''};openSheet(`<h2 style="margin-top:0">${id?'Modifier':'Nouvelle'} boutique</h2><label>Nom</label><input id="bn1" value="${esc(b.nom)}"><label>Responsable</label><input id="bn2" value="${esc(b.resp||'')}"><label>Adresse</label><input id="bn3" value="${esc(b.adr||'')}"><label>Horaires</label><input id="bn4" value="${esc(b.hor||'')}"><button class="btn gold" style="width:100%" onclick="saveBout(${id})">Enregistrer</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function saveBout(id){const b={nom:$('bn1').value.trim(),resp:$('bn2').value.trim()||null,adr:$('bn3').value.trim()||null,hor:$('bn4').value.trim()||null};if(!b.nom)return toast('Entrez un nom.');try{if(id)await api('boutiques?id=eq.'+id,{m:'PATCH',b});else await api('boutiques',{m:'POST',b});BQ=await api('boutiques?select=id,nom,resp,adr,hor,note,actif&order=nom');closeSheet();toast('Boutique enregistrée');go('bout')}catch(e){toast(/duplicate|unique/i.test(e.message)?'Ce nom existe déjà.':e.message)}}
/* ---------- caisse ---------- */
const MICO={'Espèces':'💵','Orange Money':'🟠','MTN MoMo':'🟡','Virement':'🏦','Chèque':'🧾','Carte':'💳'};
async function caisse(){if(!(isAdm()||ME.role==='Comptable')){$('main').innerHTML='<div class="alert">Accès réservé.</div>';return}
 const [V,PA,D]=await Promise.all([api('ventes?select=ticket,paye,mode,annulee&annulee=eq.false&limit=50000'),api('paiements?select=ticket,montant,mode&limit=50000'),api('depenses?select=montant,devise,mode&limit=20000')]);
 const ent={},sor={};MODES.forEach(m=>{ent[m]=0;sor[m]=0});const tk={};V.forEach(v=>{const t=tk[v.ticket||'']=tk[v.ticket||'']||{p:0,m:v.mode||'Espèces'};t.p+=+v.paye});PA.forEach(x=>{if(tk[x.ticket])tk[x.ticket].p-=+x.montant;ent[x.mode]=(ent[x.mode]||0)+ +x.montant});Object.values(tk).forEach(t=>{ent[t.m]=(ent[t.m]||0)+Math.max(0,t.p)});D.forEach(x=>{sor[x.mode]=(sor[x.mode]||0)+x.montant*dRate(x.devise)});
 const tot=MODES.reduce((a,m)=>a+(ent[m]||0)-(sor[m]||0),0),li=m=>{const v=(ent[m]||0)-(sor[m]||0);return `<div class="li" style="cursor:default"><span class="ic">${MICO[m]||'💰'}</span><div class="tx"><b>${esc(m)}</b><span>Entrées ${GA(ent[m]||0)} · Sorties ${GA(sor[m]||0)}</span></div><span class="v ${v<0?'r':''}">${G(v)}</span></div>`};
 $('main').innerHTML=`<div class="vpH"><b>Caisse</b></div><div class="vpK"><div class="g"><span>Trésorerie disponible</span><b>${GS(tot)}</b></div></div><p style="color:var(--mut);font-size:12px;margin:4px 2px 10px">Encaissements des ventes et des dettes, moins les dépenses, par mode de paiement.</p><div class="eh"><div class="bx">${MODES.map(li).join('')}</div></div>`}

/* ---------- détail vente / annulation / retour ---------- */
function venteSheet(tk){const L=VNT.filter(v=>v.ticket===tk&&!v.annulee);if(!L.length)return;const tot=L.reduce((a,v)=>a+v.q*v.pu,0),pay=L.reduce((a,v)=>a+v.paye,0),c=L[0].client_nom||'Client comptoir';
 openSheet(`<h2 style="margin-top:0">${esc(tk)}</h2><p style="color:var(--mut);margin:0 0 10px">${esc(c)} · ${new Date(L[0].date).toLocaleString('fr-FR')}</p>${L.map(v=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(pinfo(v.produit_id).nom)}</b><span>${nf(v.q)} × ${G(v.pu)}</span></div><div style="text-align:right"><b>${G(v.q*v.pu)}</b>${isAdm()?`<br><a onclick="retourSheet(${v.id},'${tk}')" style="color:#c0392b;font-size:12px">Retour</a>`:''}</div></div>`).join('')}<div class="bx" style="margin-top:10px"><div class="li" style="cursor:default"><div class="tx"><b>Total</b></div><span class="v">${G(tot)}</span></div><div class="li" style="cursor:default"><div class="tx"><b>Payé</b></div><span class="v">${G(pay)}</span></div>${tot>pay?`<div class="li" style="cursor:default"><div class="tx"><b>Reste</b></div><span class="v r">${G(tot-pay)}</span></div>`:''}</div>${isAdm()?`<button class="btn ghost" style="width:100%;margin-top:10px;color:#c0392b" onclick="annulerVente('${tk}')">Annuler toute la vente</button>`:''}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`)}
function retourSheet(id,tk){const v=VNT.find(x=>x.id===id);openSheet(`<h2 style="margin-top:0">Retour client</h2><p style="color:var(--mut)">${esc(pinfo(v.produit_id).nom)} · vendu ${nf(v.q)}</p><label>Quantité retournée</label><input id="rq" type="number" inputmode="decimal" value="${v.q}"><button class="btn gold" style="width:100%" onclick="retourSave(${id})">Valider le retour</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="venteSheet('${tk}')">Retour</button>`)}
async function retourSave(id){const q=+$('rq').value;if(!(q>0))return toast('Quantité invalide.');try{await api('rpc/retour_vente',{m:'POST',b:{p_vente:id,p_qte:q}});closeSheet();toast('Retour enregistré, stock remis');go('ventes')}catch(e){toast(e.message)}}
async function annulerVente(tk){if(!confirm('Annuler toute la vente '+tk+' ? Le stock sera remis.'))return;try{await api('rpc/annuler_vente',{m:'POST',b:{p_ticket:tk}});closeSheet();toast('Vente annulée');go('ventes')}catch(e){toast(e.message)}}

const wrapV=(n,f)=>async function(){const r=await f.apply(this,arguments);const m=$('main');if(m&&!m.querySelector(':scope>section.tab')){const sec=document.createElement('section');sec.className='tab on';sec.id='t-'+(['cli','dep','journal','caisse','bout'].includes(n)?'ventes':n);sec.dataset.v=n;while(m.firstChild)sec.appendChild(m.firstChild);m.appendChild(sec)}return r};
dash=wrapV('dash',dash);stock=wrapV('stock',stock);ventes=wrapV('ventes',ventes);cli=wrapV('cli',cli);dep=wrapV('dep',dep);journal=wrapV('journal',journal);caisse=wrapV('caisse',caisse);bout=wrapV('bout',bout);
boot();
</script></body></html>
