const ACC=[['esp','💵','Caisse principale (espèces)','Espèces'],['om','🟠','Orange Money','Orange Money'],['momo','🟡','MTN MoMo','MTN MoMo'],['vir','🏦','Banque / virements','Virement'],['chq','🧾','Chèques à encaisser','Chèque'],['carte','💳','Carte bancaire','Carte'],['coffre','🔐','Coffre-fort',null]],accOf=m=>(ACC.find(a=>a[3]===m)||ACC[0])[0];

async function cashAcc(){const [V,PA,D,TR]=await Promise.all([api('ventes?select=ticket,date,paye,mode&annulee=eq.false&limit=50000'),api('paiements?select=ticket,date,montant,mode&limit=50000'),api('depenses?select=date,libelle,montant,devise,mode&limit=20000'),api('transferts_caisse?select=date,de,vers,montant,note&limit=5000')]);
 const M=[],tk={};V.forEach(v=>{const t=tk[v.ticket||'']=tk[v.ticket||'']||{p:0,m:v.mode||'Espèces',d:v.date};t.p+=+v.paye});PA.forEach(x=>{if(tk[x.ticket])tk[x.ticket].p-=+x.montant;M.push({d:x.date,k:accOf(x.mode),v:+x.montant,l:'Encaissement dette '+(x.ticket||''),t:'in'})});
 Object.keys(tk).forEach(k=>{const t=tk[k];if(t.p>0)M.push({d:t.d,k:accOf(t.m),v:t.p,l:'Vente '+k,t:'in'})});D.forEach(x=>M.push({d:x.date,k:accOf(x.mode),v:-x.montant*dRate(x.devise),l:'Dépense · '+(x.libelle||''),t:'out'}));
 TR.forEach(x=>{const n=ACC.find(a=>a[0]===x.de),m=ACC.find(a=>a[0]===x.vers);M.push({d:x.date,k:x.de,v:-x.montant,l:'Transfert vers '+(m?m[2]:x.vers),t:'tr'});M.push({d:x.date,k:x.vers,v:+x.montant,l:'Transfert depuis '+(n?n[2]:x.de),t:'tr'})});
 M.sort((a,b)=>new Date(b.d)-new Date(a.d));const net={};ACC.forEach(a=>net[a[0]]=0);M.forEach(m=>net[m.k]=(net[m.k]||0)+m.v);return{M,net,tot:ACC.reduce((a,x)=>a+net[x[0]],0)}}

async function caisse(){if(!(isAdm()||ME.role==='Comptable')){$('main').innerHTML='<div class="alert">Accès réservé.</div>';return}

function pmAdj(uid){const p=pmPeople().find(x=>x.uid===uid);openSheet(`<h2 style="margin-top:0">± Ajustement manuel</h2><p style="color:var(--mut);margin:-4px 0 8px">${esc(p.nom)}</p><label>Montant (GNF) — négatif pour retirer</label><input id="aaM" type="number" inputmode="numeric" placeholder="Ex : 5000 ou -5000"><label>Motif (obligatoire)</label><input id="aaN"><div class="row" style="margin-top:12px"><button class="btn gold" onclick="pmAdjSave('${uid}')">Enregistrer</button><button class="btn ghost" onclick="pmDetail('${uid}')">Annuler</button></div>`)}
async function pmAdjSave(uid){const m=Math.round(+$('aaM').value||0),n=$('aaN').value.trim(),p=pmPeople().find(x=>x.uid===uid);if(!m)return toast('Indiquez un montant.');if(!n)return toast('Le motif est obligatoire.');try{await api('prime_ajustements',{m:'POST',b:{uid,nom:p.nom,montant:m,note:n,par:ME.nom}});await api('prime_hist',{m:'POST',b:{texte:'Ajustement manuel — '+p.nom+' : '+(m>0?'+':'')+FG(m)+' ('+n+')',par:ME.nom}});closeSheet();toast('Ajustement enregistré');await prim();pmDetail(uid)}catch(e){toast(e.message)}}
function pmParams(){const c=SET.pm;openSheet(`<h2 style="margin-top:0">⚙ Paramètres des primes</h2><label>Montant de référence (GNF)</label><input id="ppB" type="number" inputmode="numeric" value="${c.base}"><label>Prime par tranche (GNF)</label><input id="ppP" type="number" inputmode="numeric" value="${c.prime}"><div class="grid" style="grid-template-columns:1fr 1fr 1fr"><div><label>Vendeur %</label><input id="ppV" type="number" step="any" inputmode="decimal" value="${c.pv}" oninput="pmSum()"></div><div><label>Comptable %</label><input id="ppC" type="number" step="any" inputmode="decimal" value="${c.pc}" oninput="pmSum()"></div><div><label>Livreur %</label><input id="ppL" type="number" step="any" inputmode="decimal" value="${c.pl}" oninput="pmSum()"></div></div><p id="ppS" style="min-height:20px;margin:6px 0;font-weight:700"></p><label>Calculer à partir du</label><input id="ppD" type="date" value="${new Date(c.start).toISOString().slice(0,10)}"><p style="color:var(--mut);font-size:12.5px;margin:6px 0">Les primes déjà générées gardent leurs montants. Les nouveaux réglages s’appliquent aux prochaines tranches.</p><div class="row"><button class="btn gold" onclick="pmParamsSave()">Enregistrer</button><button class="btn ghost" onclick="closeSheet()">Annuler</button></div>`);pmSum()}
function pmSum(){const s=(+$('ppV').value||0)+(+$('ppC').value||0)+(+$('ppL').value||0),e=$('ppS');if(!e)return;const ok=Math.abs(s-100)<.001;e.style.color=ok?'#1a9d5b':'#c62828';e.textContent=ok?'✓ Total : 100 %':'⚠ Total : '+Math.round(s*100)/100+' % (doit être 100 %)'}
async function pmParamsSave(){const c=SET.pm,n={base:Math.round(+$('ppB').value||0),prime:+$('ppP').value||0,pv:+$('ppV').value||0,pc:+$('ppC').value||0,pl:+$('ppL').value||0};if(!(n.base>0)||!(n.prime>0))return toast('Montant de référence et prime doivent être supérieurs à 0.');if(Math.abs(n.pv+n.pc+n.pl-100)>.001)return toast('La somme des pourcentages doit être égale à 100 %.');
 n.start=$('ppD').value?new Date($('ppD').value+'T00:00:00').toISOString():c.start;const ch=['base','prime','pv','pc','pl','start'].filter(k=>String(c[k])!==String(n[k])).map(k=>k+' : '+c[k]+' → '+n[k]);try{await api('reglages?cle=eq.pm',{m:'PATCH',b:{valeur:n}});SET.pm=n;if(ch.length)await api('prime_hist',{m:'POST',b:{texte:'Paramètres modifiés — '+ch.join(' · '),par:ME.nom}});closeSheet();toast('Paramètres enregistrés');prim()}catch(e){toast(e.message)}}
async function pmHist(){const [L,PA,AJ,H]=await Promise.all([api('prime_lots?select=date,n,base,e_total,pv,pc,pl,prime&order=date.desc&limit=100'),api('prime_paiements?select=id,date,nom,mode,rec,par,montant&order=date.desc&limit=100'),api('prime_ajustements?select=date,nom,montant,note,par&order=date.desc&limit=100'),api('prime_hist?select=date,texte,par&order=date.desc&limit=100')]);const R=[];
 L.forEach(x=>R.push({d:x.date,t:'✅ Prime générée : '+x.n+' tranche(s) de '+FG(x.base),s:'Encaissements cumulés '+FG(x.e_total)+' · Vendeur '+FG(x.pv)+' · Comptable '+FG(x.pc)+' · Livreur '+FG(x.pl),v:+x.prime}));PA.forEach(x=>R.push({d:x.date,t:'💸 Paiement — '+x.nom,s:x.mode+' · '+x.rec+' · par '+x.par,v:-x.montant,rec:x.id}));AJ.forEach(x=>R.push({d:x.date,t:'± Ajustement — '+x.nom,s:x.note+' · par '+x.par,v:+x.montant}));H.forEach(x=>{if(!/^Paiement prime|^Ajustement manuel/.test(x.texte))R.push({d:x.date,t:'⚙ '+x.texte,s:'par '+(x.par||'—'),v:null})});R.sort((a,b)=>new Date(b.d)-new Date(a.d));
 openSheet(`<h2 style="margin-top:0">🧾 Historique des primes</h2><div style="max-height:62vh;overflow:auto">${R.slice(0,120).map(r=>`<div class="pmRow" style="cursor:${r.rec?'pointer':'default'}"${r.rec?` onclick="pmRec(${r.rec})"`:''}><div class="n"><b>${esc(r.t)}</b><span>${pmDT(r.d)} · ${esc(r.s)}</span></div>${r.v==null?'':`<div class="v ${r.v>=0?'pmPl':'pmMn'}">${r.v>=0?'+ ':''}${FG(r.v)}</div>`}</div>`).join('')||'<div class="empty">Aucun historique.</div>'}</div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Fermer</button>`)}
function pmRec(id){const x=PM.PA.find(k=>k.id===id);if(!x)return;openSheet(`<h2 style="margin-top:0">🧾 Reçu de paiement</h2><div class="k gold"><span>${esc(x.rec)} · ${pmDT(x.date)}</span><b>${FG(x.montant)}</b></div><p style="margin:10px 0 2px"><b>${esc(x.nom)}</b> · ${x.role}</p><p style="color:var(--mut);margin:0">Mode : ${esc(x.mode)} · Payé par : ${esc(x.par||'—')}${x.note?'<br>Note : '+esc(x.note):''}<br>Solde restant après paiement : ${FG(x.solde_apres)}</p><div class="row" style="margin-top:12px"><button class="btn" onclick="pmRecWa(${id})">💬 Partager</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`)}
function pmRecWa(id){const x=PM.PA.find(k=>k.id===id);window.open('https://wa.me/?text='+encodeURIComponent('*Reçu de paiement de prime* — '+(SET.nom||'Alfa ETS~B')+'\nN° '+x.rec+'\nDate : '+pmDT(x.date)+'\nBénéficiaire : '+x.nom+' ('+x.role+')\n*Montant : '+FG(x.montant)+'*\nMode : '+x.mode+'\nSolde restant : '+FG(x.solde_apres)),'_blank')}

const wrapV=(n,f)=>async function(){const r=await f.apply(this,arguments);const m=$('main');if(m&&!m.querySelector(':scope>section.tab')){const sec=document.createElement('section');sec.className='tab on';sec.id='t-'+(['dep','journal','caisse','wf','prim','wf','dettes','devis','achats','frais','banque','rap','equipe','reg'].includes(n)?'ventes':n);sec.dataset.v=n;while(m.firstChild)sec.appendChild(m.firstChild);m.appendChild(sec)}return r};
dash=wrapV('dash',dash);stock=wrapV('stock',stock);ventes=wrapV('ventes',ventes);cli=wrapV('cli',cli);dep=wrapV('dep',dep);journal=wrapV('journal',journal);caisse=wrapV('caisse',caisse);wf=wrapV('wf',wf);prim=wrapV('prim',prim);bout=wrapV('bout',bout);dettes=wrapV('dettes',dettes);devis=wrapV('devis',devis);achats=wrapV('achats',achats);frais=wrapV('frais',frais);banque=wrapV('banque',banque);inv=wrapV('inv',inv);rap=wrapV('rap',rap);equipe=wrapV('equipe',equipe);reg=wrapV('reg',reg);
boot();
</script></body></html>
