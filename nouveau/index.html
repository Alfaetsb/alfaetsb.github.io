function crCard(c,paid){const i=crInfo(c,paid);if(!i.min)return '';const pc=Math.min(100,Math.round(paid/i.min*100)),col=i.ok?'#0f9d58':'#e08a00';return `<div class="k" style="margin-top:10px"><span>Achats payés avant crédit</span><b>${G(paid)} / ${G(i.min)}</b><div class="bar" style="margin:8px 0 4px;height:8px;background:#eef1f5;border-radius:6px;overflow:hidden"><u style="display:block;height:100%;width:${pc}%;background:${col}"></u></div><span style="color:${col};font-weight:700">${i.free?'Dispensé de la règle : crédit autorisé':i.ok?'Crédit autorisé':'Crédit non autorisé : encore '+G(i.min-paid)+' d’achats payés requis'}</span></div>`}
function plCard(c,dette){const cap=capOf(c);if(!cap)return `<div class="k" style="margin-top:10px"><span>Plafond de crédit</span><b>Illimité</b></div>`;const pc=Math.min(100,Math.round(dette/cap*100)),over=dette>cap,col=over?'#d33':pc>=80?'#e08a00':'#0f9d58';return `<div class="k" style="margin-top:10px"><span>Plafond de crédit${+c.plafond>0?'':' (par défaut)'}</span><b>${G(cap)}</b><div class="bar" style="margin:8px 0 4px;height:8px;background:#eef1f5;border-radius:6px;overflow:hidden"><u style="display:block;height:100%;width:${pc}%;background:${col}"></u></div><span style="color:${col};font-weight:700">${over?'Dépassé de '+G(dette-cap):'Disponible : '+G(cap-dette)} · ${pc} %</span></div>`}

const SV2=(d,w,st)=>`<svg viewBox="0 0 24 24" width="${w||20}" height="${w||20}" fill="none" stroke="${st||'currentColor'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
async function cli(){const L=CLI.map(c=>Object.assign({c},cStats(c))),dt=L.reduce((a,x)=>a+x.due,0),nd=L.filter(x=>x.due>0).length,circ=L.reduce((a,x)=>a+x.coins,0),used=-COIN.filter(m=>+m.coins<0).reduce((a,m)=>a+(+m.coins),0),rate=+SET.coinRate||10000;
 $('main').innerHTML=`<div id="t-ventes"><div id="cliTop"><div class="cpH"><b>Clients</b><span>Crédits &amp; fidélité</span></div><div class="cpG"><div class="cpK"><div class="h"><i>${SV2('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.5-3.6 3.2-5.6 6.5-5.6s6 2 6.5 5.6"/><path d="M16 4.6a3.4 3.4 0 0 1 0 6.6M18.5 14.6c1.8.7 3 2.4 3.2 5.4"/>')}</i>Clients</div><div class="v">${CLI.length}</div><div class="s">enregistrés</div></div><div class="cpK w" style="cursor:pointer" onclick="CD=1;cli()"><div class="h"><i>${SV2('<rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18M7 15h4"/>')}</i>Reste à encaisser</div><div class="v">${GS(dt)}</div><div class="s">${nd} client${nd>1?'s':''} débiteur${nd>1?'s':''} <em style="font-style:normal;font-weight:700">· Voir ›</em></div></div></div>
 <button class="cpC" onclick="coinBilan()"><span class="ic">${SV2('<circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.5-.9-1.5-1.4-2.6-1.4-1.6 0-2.7.9-2.7 2.1 0 2.9 5.6 1.5 5.6 4.3 0 1.2-1.2 2.1-2.9 2.1-1.2 0-2.3-.6-2.8-1.6M12 6v1.8M12 16.3V18"/>',28,'#a35a00')}</span><span class="tx"><b>${nf(circ)} coins en circulation</b><span>1 coin gagné par ${ab(rate)} GNF d’achat · ${nf(used)} utilisé${used>1?'s':''}</span></span><span class="ch">${SV2('<path d="m9 6 6 6-6 6"/>',22)}</span></button>
 <div class="cpL">${isAdm()?'<button onclick="coinRule()">⚙ Règle des coins</button>':'<button disabled style="opacity:.5">⚙ Règle des coins</button>'}<button onclick="coinBilan()">📊 Coins utilisés</button></div>
 <div class="cpS"><label>${SV2('<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>')}<input id="cq2" class="cq3" placeholder="Nom, tél. ou identifiant" value="${esc(CQ)}" oninput="CQ=this.value;cliList()" autocomplete="off"></label><button class="ad" onclick="editCli(0)">＋ Client</button></div>
 <div class="cpF" id="cpF"><button class="${CD===0?'on':''}" onclick="CD=0;cli()">Tous · ${L.length}</button><button class="${CD===1?'on':''}" onclick="CD=1;cli()">Débiteurs · ${nd}</button><button class="${CD===2?'on':''}" onclick="CD=2;cli()">À jour · ${L.length-nd}</button></div><button class="btn gold tcBtn" onclick="topClients()">🏆 Meilleurs clients du mois</button></div><div style="height:10px"></div><div id="cl"></div></div>`;cliList()}
function topClients(){const m0=new Date();m0.setDate(1);m0.setHours(0,0,0,0);const bm={};VNT.filter(v=>!v.annulee&&new Date(v.date)>=m0).forEach(v=>{const k=v.client_nom||'Client comptoir';bm[k]=(bm[k]||0)+v.q*v.pu});const L=Object.entries(bm).sort((a,b)=>b[1]-a[1]).slice(0,10);openSheet(`<h2 style="margin-top:0">🏆 Meilleurs clients du mois</h2>${L.map((x,i)=>`<div class="item" style="cursor:default"><div class="t"><b>${i===0?'🥇 ':i===1?'🥈 ':i===2?'🥉 ':(i+1)+'. '}${esc(x[0])}</b></div><b>${GA(x[1])}</b></div>`).join('')||'<p style="color:var(--mut)">Aucune vente ce mois-ci.</p>'}<button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Fermer</button>`)}
function coinBilan(){const rows=COIN.filter(m=>+m.coins<0),used=-rows.reduce((a,m)=>a+(+m.coins),0);openSheet(`<h2 style="margin-top:0">Coins utilisés</h2><div class="bx"><div class="li" style="cursor:default"><div class="tx"><b>Total utilisé</b><span>${rows.length} opération(s)</span></div><span class="v">${nf(used)} 🪙</span></div><div class="li" style="cursor:default"><div class="tx"><b>Valeur d’un coin</b></div><span class="v">${G(+SET.coinVal||0)}</span></div></div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Fermer</button>`)}
function coinRule(){openSheet(`<h2 style="margin-top:0">Règle des coins</h2><label>Achat (GNF) pour gagner 1 coin</label><input id="cr1" type="number" inputmode="decimal" value="${+SET.coinRate||10000}"><label>Valeur d’un coin (GNF)</label><input id="cr2" type="number" inputmode="decimal" value="${+SET.coinVal||10}"><button class="btn gold" style="width:100%;margin-top:8px" onclick="coinRuleSave()">Enregistrer</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function coinRuleSave(){try{await api('reglages?cle=eq.coinRate',{m:'PATCH',b:{valeur:+$('cr1').value}});await api('reglages?cle=eq.coinVal',{m:'PATCH',b:{valeur:+$('cr2').value}});SET.coinRate=+$('cr1').value;SET.coinVal=+$('cr2').value;closeSheet();toast('Règle enregistrée');cli()}catch(e){toast(e.message)}}
function cliList(){const q=CQ.toLowerCase(),L=CLI.map(c=>Object.assign({c},cStats(c))).filter(x=>(CD===0||(CD===1?x.due>0:x.due<=0))&&(!q||(x.c.nom+' '+(x.c.tel||'')).toLowerCase().includes(q))).sort((a,b)=>b.due-a.due||b.tot-a.tot);
 $('cl').innerHTML=L.map(x=>`<div class="cpI" onclick="cliSheet(${x.c.id})"><div class="r1"><span class="av" style="background:#e3f6ee;color:#0f7a4d">${esc(ini(x.c.nom))}</span><span class="nm"><b>${esc(x.c.nom)}</b><span>${esc(x.c.tel||'Pas de téléphone')}</span></span><span class="bd ${x.due>0?'d':x.tot>0?'o':'n'}">${x.due>0?'Dette '+abx(x.due):x.tot>0?'À jour':'Nouveau'}</span></div><div class="r2"><span>Achats <b style="color:var(--ink)">${GA(x.tot)}</b></span><span class="co">${nf(x.coins)} 🪙</span></div></div>`).join('')||'<div class="empty">Aucun client. Touchez « ＋ Client » pour en ajouter.</div>'}
function cliSheet(id){const c=CLI.find(x=>x.id===id);if(!c)return;const s=cStats(c),T={};s.vs.forEach(v=>{const t=T[v.ticket]||(T[v.ticket]={tk:v.ticket,d:v.date,tot:0,due:0});t.tot+=v.q*v.pu;t.due+=Math.max(0,v.q*v.pu-v.paye)});const L=Object.values(T).sort((a,b)=>new Date(b.d)-new Date(a.d));
 openSheet(`<h2 style="margin-top:0">${esc(c.nom)}</h2><p style="color:var(--mut);margin:0 0 10px">${esc(c.tel||'')} ${esc(c.adresse||'')}</p><div class="grid"><div class="k"><span>Achats</span><b>${GS(s.tot)}</b></div><div class="k"><span>Dette</span><b>${GS(s.due)}</b></div><div class="k"><span>Coins</span><b>${nf(s.coins)} 🪙</b></div><div class="k"><span>Valeur coins</span><b>${GS(s.coins*(+SET.coinVal||10))}</b></div></div>${plCard(c,debtByName(c.nom))}<div id="crBox"></div>
 <h3 style="margin:14px 0 6px">Tickets</h3><div>${L.slice(0,20).map(t=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(t.tk||'—')}</b><span>${new Date(t.d).toLocaleDateString('fr-FR')} · ${G(t.tot)}</span></div>${t.due>0?`<button class="btn gold" style="padding:8px 12px" onclick="encSheet('${esc(t.tk)}',${t.due},'${esc(c.nom)}')">Encaisser ${ab(t.due)}</button>`:'<span class="badge" style="background:#e3f6ee;color:#0f7a4d">Payé</span>'}</div>`).join('')||'<p style="color:var(--mut)">Aucun achat.</p>'}</div>
 ${isAdm()?`<button class="btn ghost" style="width:100%;margin-top:10px" onclick="bonusSheet(${c.id})">🪙 Ajouter / retirer des coins</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="editCli(${c.id})">Modifier la fiche</button>`:''}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`);crLoad(c)}
function crLoad(c){if(!creditMin())return;paidOf(c,c.nom).then(v=>{const e=$('crBox');if(e)e.innerHTML=crCard(c,v)})}
function editCli(id){const c=CLI.find(x=>x.id===id)||{nom:'',tel:'',adresse:''};if(!canSell()&&ME.role!=='Comptable')return;
 openSheet(`<h2 style="margin-top:0">${id?'Modifier':'Nouveau'} client</h2><label>Nom</label><input id="cn" value="${esc(c.nom)}"><label>Téléphone</label><input id="ct" inputmode="tel" value="${esc(c.tel||'')}"><label>Adresse</label><input id="ca" value="${esc(c.adresse||'')}">${isAdm()?`<label>Plafond de dette (GNF) — 0 = défaut${+SET.plafond_defaut>0?' ('+nf(SET.plafond_defaut)+')':' / illimité'}</label><input id="cpl" type="number" inputmode="decimal" value="${+c.plafond||''}" placeholder="0"><label style="display:flex;align-items:center;gap:8px;margin-top:10px"><input id="cfree" type="checkbox" style="width:auto;margin:0"${c.credit_libre?' checked':''}> Dispensé de la règle d’achat minimum</label>`:''}<button class="btn gold" style="width:100%" onclick="saveCli(${id})">Enregistrer</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function saveCli(id){const b={nom:$('cn').value.trim(),tel:$('ct').value.trim()||null,adresse:$('ca').value.trim()||null};if(isAdm()&&$('cpl')){b.plafond=Math.max(0,+$('cpl').value||0);b.credit_libre=!!$('cfree').checked}if(!b.nom)return toast('Entrez un nom.');
 try{if(id)await api('clients?id=eq.'+id,{m:'PATCH',b});else await api('clients',{m:'POST',b});closeSheet();toast('Client enregistré');go('cli')}catch(e){toast(/duplicate|unique/i.test(e.message)?'Ce client existe déjà.':e.message)}}
function encSheet(tk,due,nom){openSheet(`<h2 style="margin-top:0">Encaisser</h2><p style="color:var(--mut);margin:0 0 10px">${esc(nom)} · ticket ${esc(tk)} · reste ${G(due)}</p><label>Montant reçu</label><input id="em2" type="number" inputmode="decimal" value="${due}"><label>Mode de paiement</label><select id="eo">${MODES.map(m=>`<option>${m}</option>`).join('')}</select><button class="btn gold" style="width:100%" onclick="encSave('${esc(tk)}',${due})">Valider l’encaissement</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function encSave(tk,due){const m=+$('em2').value;if(!(m>0))return toast('Montant invalide.');if(m>due)return toast('Le montant dépasse le reste à payer.');
 try{await api('rpc/encaisser',{m:'POST',b:{p_ticket:tk,p_montant:m,p_mode:$('eo').value}});closeSheet();toast('Encaissé : '+G(m));go('cli')}catch(e){toast(e.message)}}
function bonusSheet(id){openSheet(`<h2 style="margin-top:0">Coins</h2><p style="color:var(--mut);margin:0 0 10px">Positif = ajouter, négatif = retirer.</p><label>Nombre de coins</label><input id="bc" type="number" inputmode="numeric"><label>Motif</label><input id="bn" placeholder="Récompense meilleur client"><button class="btn gold" style="width:100%" onclick="bonusSave(${id})">Valider</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function bonusSave(id){const n=+$('bc').value;if(!n)return toast('Entrez un nombre de coins.');try{await api('coin_mouvements',{m:'POST',b:{client_id:id,coins:n,note:$('bn').value.trim()||null,auteur:ME.id}});await api('journal',{m:'POST',b:{user_id:ME.id,user_nom:ME.nom,texte:'Coins '+(n>0?'+':'')+n+' : '+(CLI.find(c=>c.id===id)||{}).nom}});closeSheet();toast('Coins mis à jour');go('cli')}catch(e){toast(e.message)}}

/* ---------- caisse ---------- */
const MICO={'Espèces':'💵','Orange Money':'🟠','MTN MoMo':'🟡','Virement':'🏦','Chèque':'🧾','Carte':'💳'};
const ACC=[['esp','💵','Caisse principale (espèces)','Espèces'],['om','🟠','Orange Money','Orange Money'],['momo','🟡','MTN MoMo','MTN MoMo'],['vir','🏦','Banque / virements','Virement'],['chq','🧾','Chèques à encaisser','Chèque'],['carte','💳','Carte bancaire','Carte'],['coffre','🔐','Coffre-fort',null]],accOf=m=>(ACC.find(a=>a[3]===m)||ACC[0])[0];
let CFP='all';
async function cashAcc(){const [V,PA,D,TR]=await Promise.all([api('ventes?select=ticket,date,paye,mode&annulee=eq.false&limit=50000'),api('paiements?select=ticket,date,montant,mode&limit=50000'),api('depenses?select=date,libelle,montant,devise,mode&limit=20000'),api('transferts_caisse?select=date,de,vers,montant,note&limit=5000')]);
 const M=[],tk={};V.forEach(v=>{const t=tk[v.ticket||'']=tk[v.ticket||'']||{p:0,m:v.mode||'Espèces',d:v.date};t.p+=+v.paye});PA.forEach(x=>{if(tk[x.ticket])tk[x.ticket].p-=+x.montant;M.push({d:x.date,k:accOf(x.mode),v:+x.montant,l:'Encaissement dette '+(x.ticket||''),t:'in'})});
 Object.keys(tk).forEach(k=>{const t=tk[k];if(t.p>0)M.push({d:t.d,k:accOf(t.m),v:t.p,l:'Vente '+k,t:'in'})});D.forEach(x=>M.push({d:x.date,k:accOf(x.mode),v:-x.montant*dRate(x.devise),l:'Dépense · '+(x.libelle||''),t:'out'}));
 TR.forEach(x=>{const n=ACC.find(a=>a[0]===x.de),m=ACC.find(a=>a[0]===x.vers);M.push({d:x.date,k:x.de,v:-x.montant,l:'Transfert vers '+(m?m[2]:x.vers),t:'tr'});M.push({d:x.date,k:x.vers,v:+x.montant,l:'Transfert depuis '+(n?n[2]:x.de),t:'tr'})});
 M.sort((a,b)=>new Date(b.d)-new Date(a.d));const net={};ACC.forEach(a=>net[a[0]]=0);M.forEach(m=>net[m.k]=(net[m.k]||0)+m.v);return{M,net,tot:ACC.reduce((a,x)=>a+net[x[0]],0)}}
async function cashByMode(){const c=await cashAcc(),net={};MODES.forEach(m=>net[m]=c.net[accOf(m)]||0);return{net,tot:c.tot}}
function cfpSet(v){CFP=v;caisse()}
async function caisse(){if(!(isAdm()||ME.role==='Comptable')){$('main').innerHTML='<div class="alert">Accès réservé.</div>';return}
 const c=await cashAcc();window._cm=c.M;const t0=new Date();t0.setHours(0,0,0,0);const m0=new Date(t0);m0.setDate(1);const P=c.M.filter(m=>CFP==='all'||new Date(m.d)>=(CFP==='day'?t0:m0)&&m.t!=='tr'||(CFP==='all')),Pn=P.filter(m=>m.t!=='tr'),ei=Pn.filter(m=>m.v>0).reduce((a,m)=>a+m.v,0),so=-Pn.filter(m=>m.v<0).reduce((a,m)=>a+m.v,0);
 $('main').innerHTML=`<h2>Caisse</h2><div class="k gold" style="margin-bottom:10px"><span>Trésorerie totale (tous comptes)</span><b>${G(c.tot)}</b><span>Solde actuel, toutes périodes</span></div><div class="grid">${ACC.map(a=>`<div class="k" style="cursor:pointer" onclick="accRel('${a[0]}')"><span>${a[1]} ${a[2]}</span><b class="${c.net[a[0]]<0?'neg':''}">${G(c.net[a[0]])}</b><span>voir les mouvements</span></div>`).join('')}</div><div class="row" style="margin:10px 0"><button class="btn gold" onclick="accXfer('esp','coffre')">🔐 Verser la caisse au coffre</button><button class="btn" onclick="accXfer('coffre','esp')">↩ Retirer du coffre</button></div><div class="row" style="margin:0 0 10px"><button class="btn ghost" onclick="accXfer('om','esp')">🟠 Retrait Orange Money → caisse</button><button class="btn ghost" onclick="accXfer()">⇄ Autre transfert</button></div><h2 style="margin-top:14px">Période</h2><div class="chips">${[['day','Aujourd’hui'],['month','Ce mois'],['all','Tout']].map(x=>`<span class="chip" style="${CFP===x[0]?'font-weight:700;background:#145bd7;color:#fff':''}" onclick="cfpSet('${x[0]}')">${x[1]}</span>`).join('')}</div><div class="grid"><div class="k"><span>Encaissements</span><b class="pos">${G(ei)}</b></div><div class="k"><span>Décaissements</span><b class="neg">${G(so)}</b></div><div class="k"><span>Solde de la période</span><b>${G(ei-so)}</b><span>hors transferts entre comptes</span></div></div><h2>Mouvements</h2>${c.M.slice(0,40).map(m=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(m.l)}</b><span>${fdt(m.d)} · ${esc((ACC.find(a=>a[0]===m.k)||[])[2]||'')}</span></div><b class="${m.v<0?'neg':'pos'}">${m.v>0?'+':''}${nf(m.v)}</b></div>`).join('')||'<div class="empty">Aucun mouvement.</div>'}`}
function accRel(k){const a=ACC.find(x=>x[0]===k),L=window._cm.filter(m=>m.k===k).slice(0,60);openSheet(`<h2 style="margin-top:0">${a[1]} ${a[2]}</h2><div style="max-height:60vh;overflow:auto">${L.map(m=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(m.l)}</b><span>${fdt(m.d)}</span></div><b class="${m.v<0?'neg':'pos'}">${m.v>0?'+':''}${nf(m.v)}</b></div>`).join('')||'<p style="color:var(--mut)">Aucun mouvement.</p>'}</div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="closeSheet()">Fermer</button>`)}
function accXfer(de,vers){const o=(v)=>ACC.map(a=>`<option value="${a[0]}"${a[0]===v?' selected':''}>${a[1]} ${a[2]}</option>`).join('');openSheet(`<h2 style="margin-top:0">Transfert entre comptes</h2><label>De</label><select id="xd">${o(de||'esp')}</select><label>Vers</label><select id="xv">${o(vers||'coffre')}</select><label>Montant (GNF)</label><input id="xm" type="number" inputmode="decimal"><label>Note</label><input id="xn"><button class="btn gold" style="width:100%;margin-top:8px" onclick="accXferSave()">Valider</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Annuler</button>`)}
async function accXferSave(){const m=+$('xm').value,d=$('xd').value,v=$('xv').value;if(d===v)return toast('Choisissez deux comptes différents.');if(!(m>0))return toast('Entrez un montant.');try{await api('transferts_caisse',{m:'POST',b:{de:d,vers:v,montant:m,note:$('xn').value.trim()||null}});await api('journal',{m:'POST',b:{user_id:ME.id,user_nom:ME.nom,texte:'Transfert '+nf(m)+' GNF : '+d+' → '+v}});closeSheet();toast('Transfert enregistré');caisse()}catch(e){toast(e.message)}}

function venteSheet(tk){const L=VNT.filter(v=>v.ticket===tk&&!v.annulee);if(!L.length)return;const tot=L.reduce((a,v)=>a+v.q*v.pu,0),pay=L.reduce((a,v)=>a+v.paye,0),c=L[0].client_nom||'Client comptoir';
 openSheet(`<h2 style="margin-top:0">${esc(tk)}</h2><p style="color:var(--mut);margin:0 0 10px">${esc(c)} · ${new Date(L[0].date).toLocaleString('fr-FR')}</p>${L.map(v=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(pinfo(v.produit_id).nom)}</b><span>${nf(v.q)} × ${G(v.pu)}</span></div><div style="text-align:right"><b>${G(v.q*v.pu)}</b>${isAdm()?`<br><a onclick="retourSheet(${v.id},'${tk}')" style="color:#c0392b;font-size:12px">Retour</a>`:''}</div></div>`).join('')}<div class="bx" style="margin-top:10px"><div class="li" style="cursor:default"><div class="tx"><b>Total</b></div><span class="v">${G(tot)}</span></div><div class="li" style="cursor:default"><div class="tx"><b>Payé</b></div><span class="v">${G(pay)}</span></div>${tot>pay?`<div class="li" style="cursor:default"><div class="tx"><b>Reste</b></div><span class="v r">${G(tot-pay)}</span></div>`:''}</div>${isAdm()?`<button class="btn ghost" style="width:100%;margin-top:10px;color:#c0392b" onclick="annulerVente('${tk}')">Annuler toute la vente</button>`:''}<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`)}

const hd=(t,k)=>`<div class="vpH"><b>${t}</b></div>${k||''}`,kp=l=>`<div class="vpK">${l.map(x=>`<div${x[2]?' class="g"':''}><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`,row=(ic,t,sub,v,oc)=>`<div class="li"${oc?` onclick="${oc}"`:' style="cursor:default"'}><span class="ic">${ic}</span><div class="tx"><b>${esc(t)}</b><span>${esc(sub||'')}</span></div><span class="v">${v||''}</span></div>`,fdt=d=>new Date(d).toLocaleDateString('fr-FR');

 $('main').innerHTML=hd('Dettes clients',kp([['Clients débiteurs',L.length],['Total à encaisser',GS(tot),1]]))+`<div class="eh"><div class="bx">${L.map(x=>row('👤',x.n,[...new Set(x.l)].length+' ticket(s)',GS(x.d))).join('')||'<div class="em">Aucune dette.</div>'}</div></div>`}

  if(tg==='INPUT'&&/^(button|submit)$/.test(e.type)&&e.value){var r2=tr(e.value);if(r2!==e.value)e.value=r2}}
function walk(root){
  if(root.nodeType===3){node(root);return}
  if(root.nodeType!==1&&root.nodeType!==9&&root.nodeType!==11)return;
  if(root.nodeType===1){var tg=root.tagName;if(tg==='SCRIPT'||tg==='STYLE')return;el(root)}
  var w=document.createTreeWalker(root,NodeFilter.SHOW_ELEMENT|NodeFilter.SHOW_TEXT,null),n;
  while(n=w.nextNode()){if(n.nodeType===3){if(n.parentNode&&/^(SCRIPT|STYLE)$/.test(n.parentNode.tagName))continue;node(n)}else el(n)}}
var mo=new MutationObserver(function(ms){
  for(var i=0;i<ms.length;i++){var m=ms[i];
    if(m.type==='childList'){for(var k=0;k<m.addedNodes.length;k++)walk(m.addedNodes[k])}
    else if(m.type==='characterData')node(m.target);
    else if(m.type==='attributes')el(m.target)}});
function start(){walk(document.body);mo.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:AT})}
if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
/* dates & dialogues */
['toLocaleDateString','toLocaleString','toLocaleTimeString'].forEach(function(f){var o=Date.prototype[f];Date.prototype[f]=function(l,op){if(l==='fr-FR'||l==='fr'||l===undefined)l=LOC;return o.call(this,l,op)}});
var _c=window.confirm;window.confirm=function(m){return _c.call(window,tr(m))};
var _a=window.alert;window.alert=function(m){return _a.call(window,tr(String(m)))};
})();
