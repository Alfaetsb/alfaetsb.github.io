function guessCategory(n){const t=String(n||'').toLowerCase();if(/tube|coude|rosace|boule inox|embout|bague|support|connecteur|potelet|pince verre|fixation/.test(t))return 'Accessoires inox';if(/decoration|décoration|diamond/.test(t))return 'Décoration inox';if(/disque|cire|buse|pad polissage|fraise|scie cloche/.test(t))return 'Consommables & outillage';if(/vitre|verre/.test(t))return 'Accessoires verre';return 'Autres'}

  lots.push({id:1,nom:'Stock initial',init:true,d:new Date().toISOString(),fourn:'',lignes:ini,frais:o.frais.map(x=>({...x}))});
  ach.forEach(a=>lots.push({id:a.id,nom:'Achat — '+a.nom,d:a.d,fourn:a.fourn||'',lignes:[{pid:a.pid,q:a.q,pa:a.pa,prev:a.prev}],frais:[]}));

function fuMap(){if(_fu)return _fu;const m={};S.lots.forEach(l=>{const r=lotRatio(l);l.lignes.forEach(x=>{const e=m[x.pid]||(m[x.pid]={q:0,v:0});e.q+=x.q;e.v+=x.q*x.pa*S.taux*r})});Object.keys(m).forEach(k=>m[k]=m[k].q>0?m[k].v/m[k].q:0);return _fu=m}

function renderDash(){

 const ben=S.ventes.reduce((a,v)=>a+v.q*(v.pu-v.cr),0);

 const now=new Date(),hr=now.getHours(),hello=(hr<5||hr>=18)?'Bonsoir':'Bonjour';
 const sameDay=(a,b)=>new Date(a).toDateString()===b.toDateString();
 const sumDay=d=>S.ventes.filter(v=>sameDay(v.d,d)).reduce((a,v)=>a+v.q*v.pu,0);
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});
 const vals=days.map(sumDay),mx=Math.max(...vals,1),tot7=vals.reduce((a,x)=>a+x,0);
 const caJ=sumDay(now),nbJ=S.ventes.filter(v=>sameDay(v.d,now)).length;
 $('t-dash').innerHTML=`<div style="margin:2px 2px 12px"><div style="font:600 20px var(--hf)">${hello} 👋</div><div style="color:var(--mut);font-size:13px">${now.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</div></div>
 <div class="hero"><small>Ventes aujourd'hui · ${nbJ} vente${nbJ>1?'s':''}</small><b class="big">${G(caJ)}</b>
  <div class="sub"><div><small>Chiffre d'affaires</small><b>${G(ca)}</b></div><div><small>Bénéfice réalisé</small><b style="color:${ben>=0?'#7fd1a8':'#f0a39b'}">${G(ben)}</b></div></div></div>

 ${sansPv.length&&(typeof ME==='undefined'||!ME||ME.role==='Administrateur'||ME.role==='Gérant')?`<div class="alert" style="margin:10px 0;display:flex;align-items:center;gap:10px;justify-content:space-between"><span><b>${sansPv.length} produit${sansPv.length>1?'s':''}</b> sans prix de vente : les marges ne peuvent pas être calculées.</span><button class="btn" style="flex:none;padding:8px 12px;font-size:13px" onclick="bulkPrix()">Fixer les prix</button></div>`:''}
 ${low.length?`<div class="sec"><h2>⚠ Stock bas</h2><button class="link" onclick="go('stock')">Voir le stock ›</button></div><div class="alert"><b>${low.length} produit${low.length>1?'s':''}</b> à réapprovisionner (seuil ≤ ${f(S.seuil)})</div>`+low.slice(0,4).map(p=>`<div class="item" onclick="editProd(${p.id})">${p.img?thumb(p):''}<div class="t"><b>${esc(p.nom)}</b></div><span class="badge low">${f(p.qte)} restants</span></div>`).join('')+(low.length>4?`<div class="empty" style="padding:6px"><button class="link" onclick="go('stock')">+ ${low.length-4} autre${low.length-4>1?'s':''}</button></div>`:''):''}

 <div class="sec"><h2>Frais de cette commande</h2><button class="link" onclick="editLotFrais(${id},undefined,1)">+ Frais</button></div>${l.frais.map((x,i)=>`<div class="item" onclick="editLotFrais(${id},${i},1)"><div class="t"><b>${esc(x.nom)}</b><span>${f(x.m,x.dev==='GNF'?0:2)} ${x.dev}</span></div><span class="badge">${G(x.m*RT()[x.dev])}</span></div>`).join('')||'<div class="empty">Aucun frais pour cette commande.</div>'}

 if(x){const paid=(x.pays||[]).reduce((a,q)=>a+q.m,0);if(m<paid){alert('Le montant ne peut pas être inférieur aux versements déjà reçus ('+G(paid)+').');return}x.m=m;x.motif=motif;if(ds&&ds!==dYmd(x.d))x.d=new Date(ds+'T12:00:00').toISOString()}
 else S.dettes.push({id:Date.now(),cl,m,motif,d:ds?new Date(ds+'T12:00:00').toISOString():new Date().toISOString(),pays:[]});
 save();closeSheet();render();cliDetail(cl)}
function debtDetail(id){const x=detOf(id);if(!x)return;const c=S.clients.find(k=>k.id===x.cl),paid=(x.pays||[]).reduce((a,q)=>a+q.m,0),D=dueD(x);
 openSheet(`<h2 style="margin-top:0">Dette — ${esc(c?c.nom:'')}</h2><p style="color:var(--mut);margin:0 0 10px">${new Date(x.d).toLocaleDateString('fr-FR')}${x.motif?' · '+esc(x.motif):''}</p><div class="grid"><div class="k"><span>Montant</span><b>${G(x.m)}</b></div><div class="k"><span>Déjà payé</span><b class="pos">${G(paid)}</b></div><div class="k gold"><span>Reste à payer</span><b>${G(D)}</b></div></div>`+((x.pays||[]).length?`<h2>Versements</h2>`+x.pays.map(q=>`<div class="item"><div class="t"><b>Versement</b><span>${new Date(q.d).toLocaleString('fr-FR')}</span></div><span class="badge" style="background:#dff1e7;color:var(--good)">− ${G(q.m)}</span></div>`).join(''):'')+`<div class="row" style="margin-top:12px">${D>0?`<button class="btn gold" onclick="payDette(${id})">Encaisser</button>`:''}<button class="btn" onclick="editDette(${id})">Modifier</button></div><div class="row" style="margin-top:8px"><button class="btn red" onclick="delDette(${id})">Supprimer</button><button class="btn ghost" onclick="cliDetail(${x.cl})">Retour</button></div>`)}
function payDette(id){const x=detOf(id);if(!x||!(dueD(x)>0))return;const D=dueD(x);
 openSheet(`<h2 style="margin-top:0">Encaisser la dette</h2><p style="color:var(--mut)">Reste à payer : <b>${G(D)}</b></p><label>Montant reçu maintenant (${CUR()})</label><input id="dp" type="number" step="any" inputmode="decimal" value="${toD(D)}"><div style="height:14px"></div><div class="row"><button class="btn gold" onclick="doPayDette(${id},1)">Tout régler</button><button class="btn" onclick="doPayDette(${id})">Valider ce montant</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="debtDetail(${id})">Retour</button>`)}
function doPayDette(id,all){const x=detOf(id);if(!x)return;const D=dueD(x);let m=all?D:Math.round(fromD(+$('dp').value||0));if(!(m>0)){alert('Entrez un montant supérieur à 0.');return}m=Math.min(m,D);(x.pays=x.pays||[]).push({d:new Date().toISOString(),m});save();render();debtDetail(id)}
function delDette(id){const x=detOf(id);if(!x||!confirm('Supprimer cette dette ?'))return;S.dettes=S.dettes.filter(k=>k.id!==id);save();closeSheet();render();cliDetail(x.cl)}
function editClient(id){const c=id?cliOf(id):{nom:'',tel:'',note:''};
 openSheet(`<h2 style="margin-top:0">${id?'Modifier':'Nouveau'} client</h2>${c.cid?`<p style="color:var(--mut);margin:0 0 6px">Identifiant : <b>${c.cid}</b></p>`:'<p style="color:var(--mut);margin:0 0 6px">Un identifiant personnel sera généré automatiquement à l\'enregistrement.</p>'}<label>Nom</label><input id="k1" value="${esc(c.nom)}"><label>Téléphone (facultatif)</label><input id="k2" type="tel" inputmode="tel" value="${esc(c.tel||'')}"><label>Adresse (facultatif)</label><input id="k4" value="${esc(c.adresse||'')}"><label>Note (facultatif)</label><input id="k3" value="${esc(c.note||'')}"><div style="height:14px"></div><div class="row"><button class="btn gold" onclick="saveClient(${id||0})">Enregistrer</button>${id?`<button class="btn red" onclick="delClient(${id})">Supprimer</button>`:''}<button class="btn ghost" onclick="${id?`cliDetail(${id})`:'closeSheet()'}">Annuler</button></div>`)}
function saveClient(id){const nom=$('k1').value.trim();if(!nom){alert('Entrez un nom.');return}
 const old=id?S.clients.find(x=>x.id===id):null;if(S.clients.some(x=>x.id!==id&&ckey(x.nom)===ckey(nom))){alert('Ce client existe déjà.');return}
 if(old){S.ventes.forEach(v=>{if(ckey(v.client)===ckey(old.nom))v.client=nom});Object.assign(old,{nom,tel:$('k2').value.trim(),note:$('k3').value.trim(),adresse:$('k4').value.trim()})}
 else S.clients.push({id:Date.now(),cid:newCid(),nom,tel:$('k2').value.trim(),note:$('k3').value.trim(),adresse:$('k4').value.trim()});
 save();closeSheet();render();cliDetail(id||S.clients[S.clients.length-1].id)}
function delClient(id){const c=cliOf(id);if(cliStats(ckey(c.nom)).bons.length||S.dettes.some(x=>x.cl===id)){alert('Ce client a des ventes ou des dettes enregistrées : suppression impossible.');return}
 if(confirm('Supprimer ce client ?')){S.clients=S.clients.filter(x=>x.id!==id);save();closeSheet();render()}}

/* ===== Fiche client (fichier imprimable / téléchargeable) ===== */
function cliFicheHtml(id){const c=cliOf(id),s=cliStats(ckey(c.nom)),D=x=>new Date(x).toLocaleDateString('fr-FR');
 const bons=s.bons.slice().sort((a,b)=>new Date(a[0].d)-new Date(b[0].d)),first=bons[0]?D(bons[0][0].d):'—';
 const rows=bons.map(g=>{const t=sumT(g),d=sumD(g);return`<tr><td>${D(g[0].d)}</td><td>${esc(g.map(x=>x.nom+' × '+f(x.q)).join(', '))}</td><td class="r">${G(t)}</td><td class="r">${G(t-d)}</td><td class="r${d>0?' due':''}">${G(d)}</td><td class="r">+${bonCoins(g)}</td></tr>`}).join('')||'<tr><td colspan="6">Aucun achat enregistré</td></tr>';
 const pays=[];bons.forEach(g=>bonPays(g).forEach(q=>pays.push(q)));s.dets.forEach(x=>(x.pays||[]).forEach(q=>pays.push(q)));pays.sort((a,b)=>new Date(a.d)-new Date(b.d));
 const prow=pays.map(q=>`<tr><td>${D(q.d)}</td><td class="r">${G(q.m)}</td></tr>`).join('')||'<tr><td colspan="2">Aucun versement</td></tr>';
 const urow=(c.usage||[]).map(u=>`<tr><td>${D(u.d)}</td><td>${esc(u.note||'')}${u.v?' — remise '+G(u.v):''}</td><td class="r">− ${u.m}</td></tr>`).join('');
 const css='*{box-sizing:border-box}body{font:14px/1.5 system-ui,Arial,sans-serif;color:#16202a;max-width:820px;margin:0 auto;padding:24px 18px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b8862f;padding-bottom:12px}h1{margin:0;font-size:26px;letter-spacing:.3px}header p{margin:0;color:#b8862f;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px}.d{color:#5b6b78;font-size:12px}h2{font-size:15px;margin:24px 0 8px;padding-left:10px;border-left:4px solid #b8862f}.info,.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.info div,.kp div{border:1px solid #dde3e9;border-radius:10px;padding:10px 12px}.info span,.kp span{display:block;color:#5b6b78;font-size:12px}.info b,.kp b{font-size:16px}.kp small{display:block;color:#5b6b78;font-size:11px}.kp .g{background:#16222d;color:#fff;border-color:#16222d}.kp .g span{color:#e0b765}table{width:100%;border-collapse:collapse;font-size:13px}th{background:#eef1f4;text-align:left}th,td{padding:7px 8px;border-bottom:1px solid #dde3e9;vertical-align:top}.r{text-align:right;white-space:nowrap}.due{color:#b3261e;font-weight:700}tr.tot td{font-weight:700;background:#f6f1e6}button{margin-top:22px;padding:10px 18px;border:0;border-radius:10px;background:#b8862f;color:#fff;font-weight:700;font-size:14px;cursor:pointer}@media print{button{display:none}body{padding:0}}';
 return`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fiche client — ${esc(c.nom)}</title><style>${css}</style></head><body><header><div><h1>${esc(S.nom)}</h1><p>Fiche client</p></div><div class="d">Éditée le ${D(new Date())}</div></header>
<h2>Informations</h2><div class="info"><div><span>Identifiant</span><b>${esc(c.cid||'—')}</b></div><div><span>Nom</span><b>${esc(c.nom)}</b></div><div><span>Téléphone</span><b>${esc(c.tel||'—')}</b></div><div><span>Adresse</span><b>${esc(c.adresse||'—')}</b></div><div><span>Client depuis</span><b>${first}</b></div>${c.note?`<div><span>Note</span><b>${esc(c.note)}</b></div>`:''}</div>
<h2>Résumé du compte</h2><div class="kp"><div><span>Total des achats</span><b>${G(s.t)}</b><small>${s.bons.length} achat${s.bons.length>1?'s':''}</small></div><div><span>Déjà payé</span><b>${G(s.p)}</b></div><div class="g"><span>Reste à payer</span><b>${G(s.d)}</b></div>${s.dets.length?`<div><span>Dettes hors ventes</span><b>${G(s.dd)}</b><small>sur ${G(s.dm)} au total</small></div>`:''}<div><span>Coins obtenus</span><b>${s.co} coin${s.co>1?'s':''}</b><small>sur ${s.bons.length} achat${s.bons.length>1?'s':''}</small></div><div><span>Solde de coins</span><b>${s.solde} coin${s.solde>1?'s':''}</b><small>${s.us} utilisé${s.us>1?'s':''}</small></div></div>
<h2>Achats</h2><table><tr><th>Date</th><th>Articles</th><th class="r">Montant</th><th class="r">Payé</th><th class="r">Reste</th><th class="r">Coins obtenus</th></tr>${rows}${bons.length?`<tr class="tot"><td colspan="2">Total</td><td class="r">${G(s.t)}</td><td class="r">${G(s.t-(s.d-s.dd))}</td><td class="r">${G(s.d-s.dd)}</td><td class="r">+${s.co}</td></tr>`:''}</table>
${s.dets.length?`<h2>Dettes (hors ventes)</h2><table><tr><th>Date</th><th>Motif</th><th class="r">Montant</th><th class="r">Payé</th><th class="r">Reste</th></tr>${s.dets.slice().sort((a,b)=>new Date(a.d)-new Date(b.d)).map(x=>`<tr><td>${D(x.d)}</td><td>${esc(x.motif||'')}</td><td class="r">${G(x.m)}</td><td class="r">${G(x.m-dueD(x))}</td><td class="r${dueD(x)>0?' due':''}">${G(dueD(x))}</td></tr>`).join('')}<tr class="tot"><td colspan="2">Total</td><td class="r">${G(s.dm)}</td><td class="r">${G(s.dm-s.dd)}</td><td class="r">${G(s.dd)}</td></tr></table>`:''}<h2>Versements</h2><table><tr><th>Date</th><th class="r">Montant</th></tr>${prow}</table>
${urow?`<h2>Coins utilisés</h2><table><tr><th>Date</th><th>Note</th><th class="r">Coins</th></tr>${urow}</table>`:''}
<button onclick="window.print()">Imprimer / enregistrer en PDF</button></body></html>`}
function cliFicheOut(id){const c=cliOf(id);saveFile('Fiche client - '+c.nom.replace(/[\\\/:*?"<>|]+/g,'')+'.html',new Blob([cliFicheHtml(id)],{type:'text/html;charset=utf-8'}))}

/* ===== Coins de tous les clients ===== */
function coinsRows(){return S.clients.map(c=>({c,...cliStats(ckey(c.nom))})).sort((a,b)=>b.solde-a.solde||a.c.nom.localeCompare(b.c.nom))}
const coinsTot=r=>r.reduce((a,x)=>({co:a.co+x.co,us:a.us+x.us,so:a.so+x.solde}),{co:0,us:0,so:0});
function coinsAll(){const r=coinsRows(),T=coinsTot(r);
 openSheet(`<h2 style="margin-top:0">Coins des clients</h2><div class="grid"><div class="k"><span>Coins obtenus</span><b>${T.co} 🪙</b></div><div class="k"><span>Utilisés</span><b>${T.us} 🪙</b></div><div class="k gold"><span>Solde total</span><b>${T.so} 🪙</b></div></div><div style="height:10px"></div>`+(r.map((x,i)=>`<div class="item" onclick="cliDetail(${x.c.id})"><div class="t"><b>${i+1}. ${esc(x.c.nom)}</b><span>${x.c.cid||''} · ${x.co} obtenus · ${x.us} utilisés</span></div><span class="badge">${x.solde} 🪙</span></div>`).join('')||'<div class="empty">Aucun client.</div>')+`<div class="row" style="margin-top:12px"><button class="btn" onclick="coinsOut()">📄 Fichier</button><button class="btn" onclick="coinsOut(1)">⬇ Télécharger</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`)}
function coinsOut(dl){const r=coinsRows(),T=coinsTot(r),D=new Date().toLocaleDateString('fr-FR');
 const css='*{box-sizing:border-box}body{font:14px/1.5 system-ui,Arial,sans-serif;color:#16202a;max-width:820px;margin:0 auto;padding:24px 18px}header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b8862f;padding-bottom:12px}h1{margin:0;font-size:26px}header p{margin:0;color:#b8862f;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;font-size:12px}.d{color:#5b6b78;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px;margin-top:18px}th{background:#eef1f4;text-align:left}th,td{padding:7px 8px;border-bottom:1px solid #dde3e9}.r{text-align:right;white-space:nowrap}tr.tot td{font-weight:700;background:#f6f1e6}button{margin-top:22px;padding:10px 18px;border:0;border-radius:10px;background:#b8862f;color:#fff;font-weight:700;cursor:pointer}@media print{button{display:none}body{padding:0}}';
 const html=`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coins des clients</title><style>${css}</style></head><body><header><div><h1>${esc(S.nom)}</h1><p>Coins des clients</p></div><div class="d">Édité le ${D}</div></header><table><tr><th>Rang</th><th>ID</th><th>Client</th><th>Téléphone</th><th class="r">Coins obtenus</th><th class="r">Utilisés</th><th class="r">Solde</th></tr>${r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.c.cid||'')}</td><td>${esc(x.c.nom)}</td><td>${esc(x.c.tel||'—')}</td><td class="r">${x.co}</td><td class="r">${x.us}</td><td class="r"><b>${x.solde}</b></td></tr>`).join('')||'<tr><td colspan="7">Aucun client</td></tr>'}<tr class="tot"><td colspan="4">Total</td><td class="r">${T.co}</td><td class="r">${T.us}</td><td class="r">${T.so}</td></tr></table><button onclick="window.print()">Imprimer / enregistrer en PDF</button></body></html>`;
 saveFile('Coins des clients.html',new Blob([html],{type:'text/html;charset=utf-8'}))}

/* ===== Utilisation des coins pendant la vente ===== */
function cliByName(n){n=ckey(n);return n?S.clients.find(c=>ckey(c.nom)===n):null}
function coinUse(t1){const e=$('s6'),c=cliByName($('s4')?$('s4').value:'');if(!e||!c)return{n:0,v:0,c:null};const sol=cliStats(ckey(c.nom)).solde;let n=Math.floor(+e.value||0);n=Math.max(0,Math.min(n,sol,Math.floor((t1-1)/S.coinVal)));return{n,v:n*S.coinVal,c}}
function coinBoxUpd(){const b=$('coinBox');if(!b)return;const c=cliByName($('s4').value);
 if(!c){b.dataset.c='';b.innerHTML='';updTot();return}
 if(b.dataset.c!=String(c.id)){b.dataset.c=String(c.id);const so=cliStats(ckey(c.nom)).solde;
  b.innerHTML=so<1?'<p style="color:var(--mut);margin:6px 0">🪙 Ce client n’a pas de coins disponibles.</p>':`<label>🪙 Utiliser des coins (disponibles : ${so} = ${G(so*S.coinVal)})</label><div class="row"><input id="s6" type="number" inputmode="numeric" min="0" placeholder="0" oninput="updTot()"><button class="btn" onclick="$('s6').value=${so};updTot()">Tout utiliser</button></div><p id="coinInfo" style="color:var(--mut);margin:6px 0"></p>`}
 updTot()}

/* ===== Assistant intégré (hors connexion) ===== */
let aiHist=[];
const nrm=t=>String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const AI_Q=['Qui me doit de l’argent ?','Produits en stock bas','Ventes et bénéfice','Dépenses du mois','Meilleurs produits','Meilleurs clients','Coins des clients','Valeur du stock'];
const AI_STOP=new Set(['de','du','la','le','les','des','un','une','et','en','au','aux','mon','mes','ma','est','ce','qui','que','quel','quelle','quels','quelles','combien','stock','prix','reste','vendu','vendus','unites','produit','produits','pour','dans','sur','avec','donne','moi','il','ya','a','y','sont','coin','coins','client','clients','message','relance','achat','achats','vente','ventes','doit','dette','payer']);
const aiLi=a=>'<ul style="margin:6px 0 0;padding-left:18px">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const aiHr='<hr style="border:0;border-top:1px solid var(--line);margin:8px 0">';
const aiBtn=(t,js)=>`<button class="btn" style="margin-top:8px;min-height:38px;width:auto;padding:6px 12px" onclick="${js}">${t}</button>`;
function aiOpen(){if(!aiHist.length)aiHist.push({r:'a',h:'Bonjour ! Je réponds <b>hors connexion</b> à partir de vos données : dettes des clients, stock, ventes, bénéfices, dépenses et coins. Touchez une question ou écrivez la vôtre (vous pouvez citer un client, son identifiant ou un produit).'});
 openSheet(`<h2 style="margin-top:0">🤖 Assistant</h2><div id="aiLog" style="max-height:44vh;overflow:auto"></div><div class="chips" style="margin:8px 0">${AI_Q.map((x,i)=>`<button class="chip" onclick="aiAsk(AI_Q[${i}])">${x}</button>`).join('')}</div><div style="display:flex;gap:8px"><input id="aiQ" style="flex:1" placeholder="Posez une question…" onkeydown="if(event.key==='Enter')aiAsk()"><button class="btn gold" style="width:auto;padding:0 16px" onclick="aiAsk()">Envoyer</button></div><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>`);aiRender()}
function aiRender(){const b=$('aiLog');if(!b)return;b.innerHTML=aiHist.map(m=>`<div style="display:flex;justify-content:${m.r==='u'?'flex-end':'flex-start'};margin:6px 0"><div style="max-width:90%;padding:9px 12px;border-radius:14px;${m.r==='u'?'background:#f3e6c8;color:#16202a':'background:var(--card);border:1px solid var(--line)'}">${m.h}</div></div>`).join('');b.scrollTop=b.scrollHeight}
function aiAsk(t){const inp=$('aiQ'),q=(t||(inp?inp.value:'')||'').trim();if(!q)return;if(inp)inp.value='';aiHist.push({r:'u',h:esc(q)});let h;try{h=aiAnswer(q)}catch(e){h='Désolé, je n’ai pas réussi à calculer cette réponse.'}aiHist.push({r:'a',h});aiRender()}
function aiClient(t){let best=null,bs=0;S.clients.forEach(c=>{const n=nrm(c.nom),ws=n.split(/[^a-z0-9]+/).filter(w=>w.length>=3);let sc=0;if(n&&t.includes(n))sc=10;else if(c.cid&&t.includes(c.cid.toLowerCase()))sc=10;else ws.forEach(w=>{if(!AI_STOP.has(w)&&new RegExp('(^|[^a-z0-9])'+w+'([^a-z0-9]|$)').test(t))sc++});if(sc>bs){bs=sc;best=c}});return best}
function relanceTxt(c){const s=cliStats(ckey(c.nom));return`Bonjour ${c.nom}, nous vous rappelons qu’il reste ${G(s.d)} à régler sur votre compte chez ${S.nom}. Merci de passer ou d’effectuer le paiement dès que possible. Cordialement.`}
function aiCopy(id){const c=cliOf(id),t=relanceTxt(c);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert('Message copié.'),()=>prompt('Copiez le message :',t))}
function aiWa(id){const c=cliOf(id),d=(c.tel||'').replace(/\D/g,'');if(d.length<8){aiCopy(id);return}window.open('https://wa.me/'+d+'?text='+encodeURIComponent(relanceTxt(c)),'_blank')}
function aiRelance(id){const c=cliOf(id);aiHist.push({r:'a',h:`Voici un message de relance pour <b>${esc(c.nom)}</b> :<br><i>${esc(relanceTxt(c))}</i><br>${aiBtn('📋 Copier',`aiCopy(${id})`)} ${aiBtn('WhatsApp',`aiWa(${id})`)}`});aiRender()}
function aiCli(c,t){const s=cliStats(ckey(c.nom));
 if(/relance|message|rappel|whatsapp|sms/.test(t)&&s.d>0){return`Voici un message de relance pour <b>${esc(c.nom)}</b> :<br><i>${esc(relanceTxt(c))}</i><br>${aiBtn('📋 Copier',`aiCopy(${c.id})`)} ${aiBtn('WhatsApp',`aiWa(${c.id})`)}`}
 return`<b>${esc(c.nom)}</b> (${esc(c.cid||'')})<br>Achats : <b>${s.bons.length}</b> pour <b>${G(s.t)}</b><br>Déjà payé : ${G(s.p)}<br>Reste à payer : <b>${G(s.d)}</b>${s.dd>0?' (dont dettes hors ventes '+G(s.dd)+')':''}<br>Coins : <b>${s.solde} 🪙</b> (${s.co} obtenus, ${s.us} utilisés, valeur ${G(s.solde*S.coinVal)})<br>${s.d>0?aiBtn('✉ Message de relance',`aiRelance(${c.id})`)+' ':''}${aiBtn('Ouvrir la fiche',`closeSheet();cliDetail(${c.id})`)}`}
function aiProd(t){const tk=t.split(/[^a-z0-9]+/).filter(w=>w.length>=2&&!AI_STOP.has(w));if(!tk.length)return null;
 const sc=S.produits.map(p=>{const n=nrm(p.nom);return{p,s:tk.filter(w=>n.includes(w)).length}}).filter(x=>x.s>=2||(x.s>=1&&tk.length===1)).sort((a,b)=>b.s-a.s);if(!sc.length)return null;

async function saveFile(name,blob){
 try{const d=window.claude&&claude.use?await claude.use('downloads'):null;if(d){try{await d.save({filename:name,data:blob})}catch(e){}return}}catch(e){}
 const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}

 const l=[];for(let i=0;i<g.length;i++){const e=$('rq'+i);if(!e)continue;const q=Math.floor(+e.value||0);if(q<0||q>g[i].q-(g[i].rq||0)){alert('Quantité invalide pour « '+g[i].nom+' ».');return}if(q>0)l.push({x:g[i],q})}
 if(!l.length){alert('Indiquez au moins une quantité.');return}

function newDem(){openSheet(`<h2 style="margin-top:0">Demande de dépense</h2><label>Objet</label><input id="dq1" placeholder="Ex : achat de sacs d’emballage"><label>Catégorie</label><input id="dq2" list="qcats" value="${DEP_CATS[0]}"><datalist id="qcats">${DEP_CATS.map(n=>`<option value="${n}">`).join('')}</datalist><div class="row"><div><label>Montant</label><input id="dq3" type="number" step="any" inputmode="decimal"></div><div><label>Devise</label><select id="dq4">${['GNF','USD','EUR'].map(c=>`<option${c===CUR()?' selected':''}>${c}</option>`).join('')}</select></div></div><label>Justification (facultatif)</label><input id="dq5"><div style="height:14px"></div><div class="row"><button class="btn gold" onclick="saveDem()">Envoyer la demande</button><button class="btn ghost" onclick="closeSheet()">Annuler</button></div>`)}

 S.dem.push({id:Date.now(),d:new Date().toISOString(),u:ME?ME.nom:'',nom,cat:$('dq2').value.trim()||'Autres',m,dev:$('dq4').value,note:$('dq5').value.trim(),st:'demandee'});logA('Demande de dépense — '+nom+' '+f(m)+' '+$('dq4').value);save();closeSheet();render()}
function demDetail(id){const x=S.dem.find(k=>k.id===id);if(!x)return;const r=ME_(),A=r==='Administrateur',C=r==='Comptable',b=[];
 if(A&&x.st==='demandee')b.push(['gold','val','Valider la dépense'],['red','ref','Refuser']);
 if((A||C)&&x.st==='validee')b.push(['gold','pay','Décaisser (enregistrer la dépense)']);
 if(ME&&x.u===ME.nom&&x.st==='demandee')b.push(['red','del','Annuler ma demande']);
 openSheet(`<h2 style="margin-top:0">${esc(x.nom)}</h2><div class="grid"><div class="k gold"><span>Montant</span><b>${f(x.m)} ${x.dev}</b></div><div class="k"><span>Statut</span><b style="font-size:15px">${DL[x.st]}</b></div></div><p style="color:var(--mut)">${esc(x.cat)} · demandé par ${esc(x.u||'')} le ${new Date(x.d).toLocaleDateString('fr-FR')}${x.note?' · '+esc(x.note):''}</p>`+b.map(y=>`<button class="btn ${y[0]}" style="width:100%;margin-top:8px" onclick="demAct(${id},'${y[1]}')">${y[2]}</button>`).join('')+'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>')}
function demAct(id,a){const x=S.dem.find(k=>k.id===id);if(!x)return;const r=ME_(),A=r==='Administrateur',C=r==='Comptable';
 if(a==='val'&&A&&x.st==='demandee')x.st='validee';
 else if(a==='ref'&&A&&x.st==='demandee')x.st='refusee';
 else if(a==='pay'&&(A||C)&&x.st==='validee'){S.depenses.push({id:Date.now(),cat:x.cat,nom:x.nom,m:x.m,dev:x.dev,note:(x.note?x.note+' · ':'')+'Demande de '+x.u,d:new Date().toISOString()});x.st='payee'}
 else if(a==='del'&&ME&&x.u===ME.nom&&x.st==='demandee')S.dem=S.dem.filter(k=>k!==x);
 else{alert('Action non autorisée pour votre profil.');return}
 logA('Demande de dépense ('+a+') — '+x.nom+' '+f(x.m)+' '+x.dev);save();closeSheet();render()}
function demValidList(){const l=S.dem.filter(x=>x.st==='demandee').slice().reverse();openSheet('<h2 style="margin-top:0">Dépenses à valider</h2>'+(l.map(x=>`<div class="item" style="cursor:default"><div class="t"><b>${esc(x.nom)}</b><span>${esc(x.u||'')} · ${esc(x.cat)} · ${new Date(x.d).toLocaleDateString('fr-FR')}${x.note?' · '+esc(x.note):''}</span></div><span class="badge">${f(x.m)} ${x.dev}</span></div><div class="row" style="margin:0 0 10px"><button class="btn gold" onclick="demQ(${x.id},'val')">Valider</button><button class="btn red" onclick="demQ(${x.id},'ref')">Refuser</button></div>`).join('')||'<div class="empty">Aucune dépense en attente de validation.</div>')+'<button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeSheet()">Fermer</button>')}

function renderLhome(){const l=wfList(),c=k=>l.filter(g=>g[0].st===k).length,td=new Date().toDateString(),dl=l.filter(g=>g[0].st==='livree'&&(g[0].hist||[]).some(h=>h.st==='livree'&&new Date(h.d).toDateString()===td)).length,rt=l.filter(g=>(g[0].rets||[]).length).length,ps=S.produits,out=ps.filter(p=>p.qte<=0).length,low=ps.filter(p=>p.qte>0&&p.qte<=(+(p.seuil||p.min)||5)).length,go2=(f2,t)=>`wfF='${f2}';go('${t}')`,T=(cl,lb,n,act)=>`<div class="k ${cl}" style="cursor:pointer" onclick="${act}"><span>${lb}</span><b>${n}</b></div>`,nxt=l.filter(g=>g[0].st==='validee'||g[0].st==='preparee').reverse().slice(0,5);
 $('t-lhome').innerHTML=`<h2>Bonjour ${esc(ME?ME.nom:'')} 👋</h2><p style="color:var(--mut);margin:0 0 10px">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'})}</p><div class="grid">${T('gold','Prêtes à préparer',c('validee'),go2('validee','wf'))}${T('','En préparation',c('preparee'),go2('preparee','wf'))}${T('','En livraison',c('sortie'),go2('sortie','wf'))}</div><div class="grid" style="margin-top:8px">${T('','Livrées aujourd’hui',dl,go2('livree','wf'))}${T('','Commandes avec retour',rt,go2('ret','wf'))}${T(out?'gold':'','Ruptures / stock faible',out+' / '+low,"go('inv')")}</div><div class="row" style="margin:12px 0"><button class="btn gold" onclick="${go2('','wf')}">📦 Toutes les commandes</button><button class="btn" onclick="go('inv');invNew()">📋 Faire un inventaire</button></div>`+(nxt.length?'<h2>À traiter maintenant</h2>'+nxt.map(g=>wfItem(g,'Livreur')).join(''):'<div class="empty">Aucune commande à traiter pour le moment.</div>')}

 $('t-inv').innerHTML=`<h2>Inventaire</h2><label>Stock affiché</label><select onchange="invB(this.value)"><option value="">Stock principal</option>${S.boutiques.map(b=>`<option value="${b.id}"${b.id===curB?' selected':''}>${esc(b.nom)}</option>`).join('')}</select><div class="grid" style="margin:10px 0"><div class="k"><span>Références</span><b>${ps.length}</b></div><div class="k gold"><span>En rupture</span><b>${out}</b></div><div class="k"><span>Stock faible</span><b>${low}</b></div></div><p style="color:var(--mut);margin:0 0 8px">${li?'Dernier inventaire : '+new Date(li.d).toLocaleDateString('fr-FR')+' · '+esc(li.u||''):'Aucun inventaire enregistré.'}</p><button class="btn gold" style="width:100%;margin-bottom:10px" onclick="invNew()">📋 Nouvel inventaire</button>`+(iv.length?'<h2>Historique</h2>'+iv.slice(0,5).map(x=>{const n=x.l.filter(y=>y.c!==y.s).length;return`<div class="item" onclick="invDetail(${x.id})"><div class="t"><b>${new Date(x.d).toLocaleDateString('fr-FR')} · ${esc(x.u||'')}</b><span>${x.l.length} compté(s) · ${n?n+' écart'+(n>1?'s':'')+(x.ok?' · ajusté':' · à valider'):'aucun écart'}</span></div></div>`}).join(''):'')+`<h2>Produits</h2><input placeholder="🔍 Rechercher un produit" oninput="invFilter(this.value)">`+(ps.map(p=>{const st=p.qte<=0?['Rupture','low']:p.qte<=lw(p)?['Faible','low']:['En stock',''];return`<div class="item" data-n="${esc(p.nom.toLowerCase())}" style="cursor:default">${thumb(p)}<div class="t"><b>${esc(p.nom)}</b><span>${esc(p.cat||'')}${p.cat?' · ':''}<span class="badge ${st[1]}">${st[0]}</span></span></div><div style="text-align:right"><b style="font-size:18px">${f(p.qte)}</b><br><button class="btn ghost" style="padding:2px 8px" onclick="prodPhoto(${p.id})">📷</button></div></div>`}).join('')||'<div class="empty">Aucun produit.</div>')}
