 var real=null;try{real=window.localStorage;real.getItem('x')}catch(e){real=null}

 q.onerror=q.onblocked=function(){go()};
 q.onsuccess=function(){try{var db=q.result,M=new Map(),pend={},tm=null,mig=false;
  var tx=db.transaction('kv','readonly'),st=tx.objectStore('kv'),ks=st.getAllKeys(),vs=st.getAll();
  tx.onerror=tx.onabort=function(){go()};
  tx.oncomplete=function(){try{
   var inIdb={};
   if(real){for(var i=0;i<real.length;i++){var k=real.key(i);M.set(k,real.getItem(k))}}
   ks.result.forEach(function(k,i){M.set(k,vs.result[i]);inIdb[k]=1});
   var move=[];M.forEach(function(v,k){if(!inIdb[k])move.push(k)});
   var flush=function(cb){var ks2=Object.keys(pend);pend={};if(!ks2.length){cb&&cb(true);return}
    try{var t=db.transaction('kv','readwrite'),s=t.objectStore('kv');ks2.forEach(function(k){if(M.has(k))s.put(M.get(k),k);else s.delete(k)});
     t.oncomplete=function(){cb&&cb(true)};t.onerror=t.onabort=function(){ks2.forEach(function(k){pend[k]=1});cb&&cb(false)}}catch(e){ks2.forEach(function(k){pend[k]=1});cb&&cb(false)}};
   var sched=function(){if(tm)return;tm=setTimeout(function(){tm=null;flush()},150)};
   var LS={getItem:function(k){k=String(k);return M.has(k)?M.get(k):null},
    setItem:function(k,v){k=String(k);M.set(k,String(v));pend[k]=1;sched()},
    removeItem:function(k){k=String(k);M.delete(k);pend[k]=1;try{real&&real.removeItem(k)}catch(e){}sched()},
    clear:function(){Array.from(M.keys()).forEach(function(k){M.delete(k);pend[k]=1});try{real&&real.clear()}catch(e){}sched()},
    key:function(i){var a=Array.from(M.keys());return i<a.length?a[i]:null},
    get length(){return M.size}};
   Object.defineProperty(window,'localStorage',{value:LS,configurable:true});window.__alfaLS=true;
   var fl=function(){if(tm){clearTimeout(tm);tm=null}flush()};
   addEventListener('pagehide',fl);document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')fl()});
   try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
   /* migration : on copie tout dans IndexedDB, puis on libère le gros du stockage d’origine */
   move.forEach(function(k){pend[k]=1});
   flush(function(ok){if(ok&&real){move.forEach(function(k){try{if((M.get(k)||'').length>20000)real.removeItem(k)}catch(e){}})}});
   go()}catch(e){go()}};
 }catch(e){go()}}})};
